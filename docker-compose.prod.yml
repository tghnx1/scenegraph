services:
  migrate:
    build:
      context: ./backend
      dockerfile: prisma/Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-1}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-10}
      DATABASE_POOL_ACQUIRE_WARN_SECONDS: ${DATABASE_POOL_ACQUIRE_WARN_SECONDS:-0.5}
      DATABASE_CONNECTION_HOLD_WARN_SECONDS: ${DATABASE_CONNECTION_HOLD_WARN_SECONDS:-2.0}
      SCHEMA_PREFLIGHT_STRICT: ${SCHEMA_PREFLIGHT_STRICT:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
      PUBLIC_API_KEY: ${PUBLIC_API_KEY:?PUBLIC_API_KEY is required}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_UPDATE_EXISTING: ${BOOTSTRAP_ADMIN_UPDATE_EXISTING:-false}
      BOOTSTRAP_USER_USERNAME: ${BOOTSTRAP_USER_USERNAME:-}
      BOOTSTRAP_USER_EMAIL: ${BOOTSTRAP_USER_EMAIL:-}
      BOOTSTRAP_USER_PASSWORD: ${BOOTSTRAP_USER_PASSWORD:-}
      BOOTSTRAP_USER_ROLE: ${BOOTSTRAP_USER_ROLE:-artist}
      BOOTSTRAP_USER_UPDATE_EXISTING: ${BOOTSTRAP_USER_UPDATE_EXISTING:-false}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:?OPENAI_EMBEDDING_MODEL is required}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:?OPENAI_EMBEDDING_DIMENSIONS is required}
      RECOMMENDATION_JOB_RUNNING_RECLAIM_AFTER_SECONDS: ${RECOMMENDATION_JOB_RUNNING_RECLAIM_AFTER_SECONDS:-600}
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  recommendation-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.recommendations.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-1}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-10}
      DATABASE_POOL_ACQUIRE_WARN_SECONDS: ${DATABASE_POOL_ACQUIRE_WARN_SECONDS:-0.5}
      DATABASE_CONNECTION_HOLD_WARN_SECONDS: ${DATABASE_CONNECTION_HOLD_WARN_SECONDS:-2.0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:?OPENAI_EMBEDDING_MODEL is required}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:?OPENAI_EMBEDDING_DIMENSIONS is required}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:?AZURE_OPENAI_API_KEY is required}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:?AZURE_OPENAI_ENDPOINT is required}
      AZURE_OPENAI_CHAT_API_VERSION: ${AZURE_OPENAI_CHAT_API_VERSION:?AZURE_OPENAI_CHAT_API_VERSION is required}
      AZURE_OPENAI_EXTRACTION_DEPLOYMENT: ${AZURE_OPENAI_EXTRACTION_DEPLOYMENT:?AZURE_OPENAI_EXTRACTION_DEPLOYMENT is required}
      ARTIST_TAG_EXTRACTION_MAX_BIO_CHARS: ${ARTIST_TAG_EXTRACTION_MAX_BIO_CHARS:-6000}
      ARTIST_TAG_EXTRACTION_MAX_TAGS: ${ARTIST_TAG_EXTRACTION_MAX_TAGS:-32}
      ARTIST_TAG_EXTRACTION_CHUNK_CHARS: ${ARTIST_TAG_EXTRACTION_CHUNK_CHARS:-600}
      RECOMMENDATION_JOB_RUNNING_RECLAIM_AFTER_SECONDS: ${RECOMMENDATION_JOB_RUNNING_RECLAIM_AFTER_SECONDS:-600}
    depends_on:
      migrate:
        condition: service_completed_successfully

  ingestion-runner:
    build:
      context: .
      dockerfile: tools/Dockerfile.daily
    restart: unless-stopped
    command: ["sleep", "infinity"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SCHEMA_PREFLIGHT_STRICT: ${SCHEMA_PREFLIGHT_STRICT:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:?OPENAI_EMBEDDING_MODEL is required}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:?OPENAI_EMBEDDING_DIMENSIONS is required}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:?AZURE_OPENAI_API_KEY is required}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:?AZURE_OPENAI_ENDPOINT is required}
      AZURE_OPENAI_CHAT_API_VERSION: ${AZURE_OPENAI_CHAT_API_VERSION:?AZURE_OPENAI_CHAT_API_VERSION is required}
      AZURE_OPENAI_EXTRACTION_DEPLOYMENT: ${AZURE_OPENAI_EXTRACTION_DEPLOYMENT:?AZURE_OPENAI_EXTRACTION_DEPLOYMENT is required}
      ARTIST_TAG_EXTRACTION_MAX_BIO_CHARS: ${ARTIST_TAG_EXTRACTION_MAX_BIO_CHARS:-6000}
      ARTIST_TAG_EXTRACTION_MAX_TAGS: ${ARTIST_TAG_EXTRACTION_MAX_TAGS:-32}
      ARTIST_TAG_EXTRACTION_CHUNK_CHARS: ${ARTIST_TAG_EXTRACTION_CHUNK_CHARS:-600}
      SCENEGRAPH_DATA_DIR: /tmp/scenegraph-parser-data
      DAILY_INGEST_ARTIFACTS_DIR: /tmp/scenegraph-import-runs
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.prod
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
