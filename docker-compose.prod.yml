services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-1}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-10}
      DATABASE_POOL_ACQUIRE_WARN_SECONDS: ${DATABASE_POOL_ACQUIRE_WARN_SECONDS:-0.5}
      DATABASE_CONNECTION_HOLD_WARN_SECONDS: ${DATABASE_CONNECTION_HOLD_WARN_SECONDS:-2.0}
      SCHEMA_PREFLIGHT_STRICT: ${SCHEMA_PREFLIGHT_STRICT:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
      PUBLIC_API_KEY: ${PUBLIC_API_KEY:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_UPDATE_EXISTING: ${BOOTSTRAP_ADMIN_UPDATE_EXISTING:-false}
      BOOTSTRAP_USER_USERNAME: ${BOOTSTRAP_USER_USERNAME:-}
      BOOTSTRAP_USER_EMAIL: ${BOOTSTRAP_USER_EMAIL:-}
      BOOTSTRAP_USER_PASSWORD: ${BOOTSTRAP_USER_PASSWORD:-}
      BOOTSTRAP_USER_ROLE: ${BOOTSTRAP_USER_ROLE:-artist}
      BOOTSTRAP_USER_UPDATE_EXISTING: ${BOOTSTRAP_USER_UPDATE_EXISTING:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_CHAT_API_VERSION: ${AZURE_OPENAI_CHAT_API_VERSION:-2025-01-01-preview}
      AZURE_OPENAI_EXTRACTION_DEPLOYMENT: ${AZURE_OPENAI_EXTRACTION_DEPLOYMENT:-gpt-4.1}
      EVENT_TAG_EXTRACTION_MAX_TEXT_CHARS: ${EVENT_TAG_EXTRACTION_MAX_TEXT_CHARS:-7000}
      EVENT_TAG_EXTRACTION_MAX_TAGS: ${EVENT_TAG_EXTRACTION_MAX_TAGS:-12}
      EVENT_TAG_EXTRACTION_CHUNK_CHARS: ${EVENT_TAG_EXTRACTION_CHUNK_CHARS:-800}
      ARTIST_TAG_EXTRACTION_MAX_BIO_CHARS: ${ARTIST_TAG_EXTRACTION_MAX_BIO_CHARS:-6000}
      ARTIST_TAG_EXTRACTION_MAX_TAGS: ${ARTIST_TAG_EXTRACTION_MAX_TAGS:-32}
      ARTIST_TAG_EXTRACTION_CHUNK_CHARS: ${ARTIST_TAG_EXTRACTION_CHUNK_CHARS:-600}
      RECOMMENDATION_JOB_RUNNING_RECLAIM_AFTER_SECONDS: ${RECOMMENDATION_JOB_RUNNING_RECLAIM_AFTER_SECONDS:-600}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  recommendation-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.recommendations.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-1}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-10}
      DATABASE_POOL_ACQUIRE_WARN_SECONDS: ${DATABASE_POOL_ACQUIRE_WARN_SECONDS:-0.5}
      DATABASE_CONNECTION_HOLD_WARN_SECONDS: ${DATABASE_CONNECTION_HOLD_WARN_SECONDS:-2.0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_CHAT_API_VERSION: ${AZURE_OPENAI_CHAT_API_VERSION:-2025-01-01-preview}
      AZURE_OPENAI_EXTRACTION_DEPLOYMENT: ${AZURE_OPENAI_EXTRACTION_DEPLOYMENT:-gpt-4.1}
      EVENT_TAG_EXTRACTION_MAX_TEXT_CHARS: ${EVENT_TAG_EXTRACTION_MAX_TEXT_CHARS:-7000}
      EVENT_TAG_EXTRACTION_MAX_TAGS: ${EVENT_TAG_EXTRACTION_MAX_TAGS:-12}
      EVENT_TAG_EXTRACTION_CHUNK_CHARS: ${EVENT_TAG_EXTRACTION_CHUNK_CHARS:-800}
      ARTIST_TAG_EXTRACTION_MAX_BIO_CHARS: ${ARTIST_TAG_EXTRACTION_MAX_BIO_CHARS:-6000}
      ARTIST_TAG_EXTRACTION_MAX_TAGS: ${ARTIST_TAG_EXTRACTION_MAX_TAGS:-32}
      ARTIST_TAG_EXTRACTION_CHUNK_CHARS: ${ARTIST_TAG_EXTRACTION_CHUNK_CHARS:-600}
      RECOMMENDATION_JOB_RUNNING_RECLAIM_AFTER_SECONDS: ${RECOMMENDATION_JOB_RUNNING_RECLAIM_AFTER_SECONDS:-600}

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.prod
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
