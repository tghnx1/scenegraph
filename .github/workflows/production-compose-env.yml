name: Production delivery

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # GitHub keeps one running and one pending run per group. A newer main push
  # may replace an older pending push, but it cannot interrupt an active deploy.
  group: ${{ github.event_name == 'push' && 'production-deploy' || format('production-checks-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-production-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files for whitespace errors
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          else
            git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"
          fi

      - name: Validate required production environment
        run: scripts/validate_prod_compose_env.sh

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: scenegraph_test
          POSTGRES_USER: scenegraph
          POSTGRES_PASSWORD: scenegraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scenegraph -d scenegraph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://scenegraph:scenegraph@127.0.0.1:5432/scenegraph_test
      JWT_SECRET_KEY: ci-only-jwt-secret
      PUBLIC_API_KEY: ci-only-public-api-key
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      OPENAI_EMBEDDING_DIMENSIONS: "1536"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js for Prisma
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install Prisma dependencies
        working-directory: backend
        run: npm ci

      - name: Apply migrations to CI PostgreSQL
        working-directory: backend
        run: npm run prisma:deploy

      - name: Run backend test suite
        working-directory: backend
        run: pytest -q

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate-production-compose
      - backend-tests
      - frontend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: 100.84.221.35

      - name: Verify Coolify connectivity
        run: python3 -c "import socket; socket.create_connection(('100.84.221.35', 8000), timeout=10).close(); print('Connected to Coolify')"

      - name: Deploy and wait for Coolify
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: >-
          python3 scripts/coolify_deploy.py
          --base-url http://100.84.221.35:8000
          --application-uuid biclmmeszwg9zb6xi3iguo4p
          --poll-seconds 8
          --timeout-seconds 900

      - name: Run production smoke test
        run: >-
          python3 scripts/production_smoke_test.py
          --url https://scenematch.dev/health
          --retry-seconds 5
          --timeout-seconds 60
